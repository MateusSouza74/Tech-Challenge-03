# Configuracao das ferramentas de qualidade. Nao ha pacote Python para instalar
# aqui: a API e o treino sao modulos rodados da raiz do repo, e o ruff e o pytest
# existem para o CI e para quem contribui.

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W estilo | F erro real (nome indefinido, import morto) | B armadilhas comuns.
select = ["E", "W", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os modulos testados nao sao instalaveis: `app` e `treino` vivem na raiz, e a DAG
# em `dags` precisa ser importavel para a checagem de import do Airflow.
pythonpath = [".", "dags"]
addopts = "-q --strict-markers"
